services:
  converter:
    build: .
    image: converter:latest
    container_name: converter
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3004"
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3004/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
